# The tests run on an in-memory H2 database in MySQL mode, with the same Flyway migrations as production.
spring.datasource.url=jdbc:h2:mem:expenses;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
app.jwt.secret=test-only-secret-key-with-at-least-32-bytes
app.demo-data.enabled=false
