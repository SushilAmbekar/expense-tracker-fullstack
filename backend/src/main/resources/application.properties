spring.application.name=expense-tracker
server.port=8080

# MySQL. Every value can be overridden with an environment variable.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# JWT: set JWT_SECRET (at least 32 characters) in every real environment.
# Without it the application generates a random key at startup, so tokens stop working after a restart.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:PT12H}

# Origins allowed to call the API from a browser (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Creates a demo user with three months of sample expenses (demo@expense-tracker.dev / demo12345)
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}

# Actuator: health probes for Docker and Kubernetes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
