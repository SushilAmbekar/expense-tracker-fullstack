name: Release

# On every push to main: publish the Docker images to GitHub Container Registry as :latest.
# On a version tag (v1.2.3): publish :1.2.3 and :1.2 images too, then create a GitHub release
# with the API jar attached.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: expense-tracker-backend
            context: backend
            description: Expense Tracker REST API (Spring Boot 3.5, Java 17, JWT, JPA, MySQL, Flyway)
          - image: expense-tracker-frontend
            context: frontend
            description: Expense Tracker web app (Angular 20) served by nginx, which proxies /api to the backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sushilambekar/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test the API jar
        working-directory: backend
        run: ./mvnw -B -ntp verify
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp backend/target/expense-tracker-*.jar "expense-tracker-api-${version}.jar"
          cat > notes.md <<EOF
          ## Run this version

          \`\`\`bash
          docker pull ghcr.io/sushilambekar/expense-tracker-backend:${version}
          docker pull ghcr.io/sushilambekar/expense-tracker-frontend:${version}
          \`\`\`

          Or run the API jar directly (Java 17 and MySQL 8 needed):

          \`\`\`bash
          java -jar expense-tracker-api-${version}.jar
          \`\`\`

          Live demo: https://sushilambekar.github.io/expense-tracker-fullstack/
          EOF
          gh release create "$GITHUB_REF_NAME" "expense-tracker-api-${version}.jar" \
            --title "Expense Tracker ${GITHUB_REF_NAME}" --notes-file notes.md --generate-notes --verify-tag
